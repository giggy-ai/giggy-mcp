name: Validate Giggy MCP Registry metadata

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install official MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate server metadata
        run: ./mcp-publisher validate server.json
      - name: Explain publishing identity
        run: echo "Validation only. Publish manually with GitHub OAuth as the owner of the existing Registry namespace."
