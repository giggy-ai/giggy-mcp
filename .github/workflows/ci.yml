name: MCP Docs CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n examples/initialize.sh
          bash -n examples/list-tools.sh
          bash -n examples/list-voices.sh

      - name: Validate MCP and plugin JSON
        run: |
          python -m json.tool examples/claude-code.mcp.json > /dev/null
          python -m json.tool examples/cursor.mcp.json > /dev/null
          python -m json.tool examples/vscode.mcp.json > /dev/null
          python -m json.tool examples/cline.mcp.json > /dev/null
          python -m json.tool examples/windsurf.mcp.json > /dev/null
          python -m json.tool server.json > /dev/null
          python -m json.tool openai-plugin/plugin.json > /dev/null
          python -m json.tool openai-plugin/mcp.json > /dev/null
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .mcp.json > /dev/null

      - name: Validate distribution configuration
        run: |
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          root = Path(".")
          registry = json.loads((root / "server.json").read_text())
          openai = json.loads((root / "openai-plugin/plugin.json").read_text())
          openai_mcp = json.loads((root / "openai-plugin/mcp.json").read_text())
          claude = json.loads((root / ".claude-plugin/plugin.json").read_text())
          claude_mcp = json.loads((root / ".mcp.json").read_text())
          endpoint = "https://giggy.ai/mcp"

          assert registry["repository"]["url"] == openai["repository"]
          assert registry["remotes"][0]["url"] == endpoint
          assert openai_mcp["mcpServers"]["giggy-speech"]["url"] == endpoint
          assert claude_mcp["mcpServers"]["giggy-speech"]["url"] == endpoint
          assert openai["name"] == "giggy-speech"
          assert claude["name"] == "giggy-speech"
          assert openai_mcp["mcpServers"]["giggy-speech"]["type"] == "streamable-http"
          assert "headers" not in openai_mcp["mcpServers"]["giggy-speech"]
          assert Path("openai-plugin/assets/icon.png").is_file()
          assert Path("openai-plugin/assets/logo.png").is_file()
          for asset in ("openai-plugin/assets/icon.png", "openai-plugin/assets/logo.png"):
              with open(asset, "rb") as image:
                  header = image.read(24)
              assert header[:8] == b"\x89PNG\r\n\x1a\n", f"{asset} is not PNG"
              width, height = struct.unpack(">II", header[16:24])
              assert width == height and width >= 48, f"{asset} must be square and at least 48px"
          assert claude_mcp["mcpServers"]["giggy-speech"]["headers"]["Authorization"] == "Bearer ${GIGGY_API_KEY}"

          print("Giggy distribution configuration valid.")
          PY

      - name: Verify scripts are executable
        run: |
          test -x examples/initialize.sh
          test -x examples/list-tools.sh
          test -x examples/list-voices.sh

      - name: Fail if a likely real Giggy API key is committed
        shell: bash
        run: |
          matches="$(
            grep -R -n -E 'giggy_sk_[A-Za-z0-9_-]{16,}' . \
              --exclude-dir=.git \
              || true
          )"

          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Potential Giggy API key found."
            exit 1
          fi
